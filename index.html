<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co https://*.wikipedia.org https://r.jina.ai; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; frame-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; require-trusted-types-for 'script'; trusted-types default">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Rill — a calm, private AI agent that runs entirely in your browser on WebGPU.">
<title>Rill</title>
<link rel="icon" href="data:,">
<link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/rill.css">
<script src="js/trusted-types.js"></script>
<script src="js/theme.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="shell" id="shell" data-sidebar="open" data-panel="closed">
  <aside class="sidebar" id="sidebar" aria-label="Chats">
    <div class="sidebar-inner">
      <div class="brand">
        <span class="wordmark">Rill</span>
        <button class="icon-btn" id="toggleSidebar" type="button" aria-label="Hide sidebar" aria-controls="sidebar"><span class="i i-sidebar" aria-hidden="true"></span></button>
      </div>
      <nav class="nav" aria-label="Workspace">
        <button class="row row-new" id="newChat" type="button" title="New chat (Ctrl/⌘ K)"><span class="i i-plus" aria-hidden="true"></span><span class="label">New chat</span></button>
        <button class="row" id="navPlan" type="button"><span class="i i-list" aria-hidden="true"></span><span class="label">Plans</span><span class="count" id="countPlan"></span></button>
        <button class="row" id="navFiles" type="button"><span class="i i-file" aria-hidden="true"></span><span class="label">Files</span><span class="count" id="countFiles"></span></button>
        <button class="row" id="navNotes" type="button"><span class="i i-note" aria-hidden="true"></span><span class="label">Notes</span><span class="count" id="countNotes"></span></button>
      </nav>
      <nav class="chat-list" id="chatList" aria-label="Chats"></nav>
      <div class="sidebar-foot">
        <button class="row" id="statusPill" type="button" data-state="idle" aria-live="polite"><span class="sq" aria-hidden="true"></span><span class="label">LFM3 1.7B</span><span class="count" id="statusText">Not loaded</span></button>
        <button class="row" id="openSettings" type="button"><span class="i i-gear" aria-hidden="true"></span><span class="label">Settings</span></button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main">
    <div class="backdrop" aria-hidden="true"><video id="bgVideo" muted loop playsinline preload="none" tabindex="-1"></video></div>
    <button class="corner corner-left" id="openSidebar" type="button" aria-label="Show sidebar" aria-controls="sidebar"><span class="i i-sidebar" aria-hidden="true"></span></button>

    <div class="column">
      <h1 class="sr-only" id="chatTitle">New chat</h1>

      <section class="thread" id="thread" aria-label="Conversation">
        <div class="thread-inner" id="threadInner" role="log" aria-live="polite" aria-relevant="additions"></div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="composer" autocomplete="off">
          <div class="greeting" id="greeting"></div>
          <div class="attachments" id="attachments" aria-label="Attached files"></div>
          <textarea id="input" rows="1" placeholder="Ask Rill anything" aria-label="Message Rill" maxlength="20000"></textarea>
          <div class="composer-bar">
            <label class="icon-btn attach" title="Attach PDF, text or code">
              <span class="i i-plus" aria-hidden="true"></span><span class="sr-only">Attach files</span>
              <input type="file" id="fileInput" multiple hidden>
            </label>
            <span class="spacer"></span>
            <span class="composer-note" id="composerNote"></span>
            <button class="send" id="send" type="submit" aria-label="Send"><span class="i i-up" aria-hidden="true"></span></button>
          </div>
          <div class="starters" id="starters"></div>
        </form>
      </div>
    </div>
  </main>

  <aside class="panel" id="panel" aria-label="Workspace">
    <div class="panel-inner">
      <div class="tabs" role="tablist">
        <button role="tab" class="tab" id="tab-plan" aria-selected="true" aria-controls="pane-plan" type="button">Plan</button>
        <button role="tab" class="tab" id="tab-files" aria-selected="false" aria-controls="pane-files" type="button">Files</button>
        <button role="tab" class="tab" id="tab-notes" aria-selected="false" aria-controls="pane-notes" type="button">Notes</button>
        <span class="spacer"></span>
        <button class="icon-btn" id="closePanel" type="button" aria-label="Close panel"><span class="i i-x" aria-hidden="true"></span></button>
      </div>
      <div class="pane" id="pane-plan" role="tabpanel" aria-labelledby="tab-plan"></div>
      <div class="pane" id="pane-files" role="tabpanel" aria-labelledby="tab-files" hidden></div>
      <div class="pane" id="pane-notes" role="tabpanel" aria-labelledby="tab-notes" hidden></div>
    </div>
  </aside>
</div>

<div class="dropzone" id="dropzone" hidden><div class="dropzone-card">Drop files to attach</div></div>

<dialog class="dialog" id="settings" aria-labelledby="settingsTitle">
  <form method="dialog" class="dialog-body" id="settingsForm">
    <h2 id="settingsTitle">Settings</h2>
    <label class="field"><span>Your name</span><input name="name" maxlength="40" placeholder="Optional. Used in the greeting."></label>
    <label class="switch"><span><b>Run plans automatically</b><small>Start a plan as soon as it is made and keep going until it is done.</small></span><input type="checkbox" name="autoRun"><span class="track" aria-hidden="true"></span></label>
    <label class="switch"><span><b>Think first</b><small>Reason before answering. Slower, sometimes better on hard questions.</small></span><input type="checkbox" name="thinking"><span class="track" aria-hidden="true"></span></label>
    <label class="switch"><span><b>Read any web page</b><small>Uses r.jina.ai. The URLs Rill reads are sent to that service.</small></span><input type="checkbox" name="webReader"><span class="track" aria-hidden="true"></span></label>
    <label class="field"><span>Theme</span>
      <select name="theme"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Match system</option></select>
    </label>
    <label class="field"><span>Compute</span>
      <select name="device"><option value="auto">Automatic (WebGPU when available)</option><option value="webgpu">WebGPU</option><option value="wasm">CPU (slow)</option></select>
    </label>
    <p class="fine">Chats, files, plans and notes are stored in this browser only.</p>
    <div class="dialog-actions">
      <button class="btn btn-danger" id="clearData" type="button">Erase all data</button>
      <span class="spacer"></span>
      <button class="btn btn-primary" value="save" type="submit">Done</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
