<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co https://*.wikipedia.org https://r.jina.ai; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; frame-src 'self'; media-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; require-trusted-types-for 'script'; trusted-types default">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14163a">
<meta name="description" content="Rill — a calm, private AI agent that runs entirely in your browser on WebGPU.">
<title>Rill</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/rill.css">
<script src="js/trusted-types.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"><div class="backdrop-img"></div><div class="backdrop-tint"></div><div class="grain"></div></div>

<div class="shell" id="shell" data-sidebar="open">
  <aside class="sidebar glass" id="sidebar" aria-label="Chats">
    <div class="brand">
      <img src="assets/logo.svg" alt="" width="28" height="28">
      <span class="wordmark">Rill</span>
    </div>
    <button class="btn btn-new" id="newChat" type="button"><span class="i i-plus" aria-hidden="true"></span>New chat<kbd>⌘K</kbd></button>
    <nav class="chat-list" id="chatList" aria-label="Recent chats"></nav>
    <div class="sidebar-foot">
      <button class="btn btn-ghost" id="openSettings" type="button"><span class="i i-gear" aria-hidden="true"></span>Settings</button>
      <p class="privacy-note">Runs on your device. Nothing you type leaves it, except searches you allow.</p>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn" id="toggleSidebar" type="button" aria-label="Toggle chats" aria-controls="sidebar"><span class="i i-menu" aria-hidden="true"></span></button>
      <h1 class="chat-title" id="chatTitle">New chat</h1>
      <button class="status-pill" id="statusPill" type="button" data-state="idle" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="statusText">Model not loaded</span></button>
      <button class="icon-btn" id="togglePanel" type="button" aria-label="Plans, files and notes" aria-controls="panel" aria-expanded="false"><span class="i i-panel" aria-hidden="true"></span><span class="badge" id="panelBadge" hidden></span></button>
    </header>

    <section class="thread" id="thread" aria-label="Conversation">
      <div class="thread-inner" id="threadInner" role="log" aria-live="polite" aria-relevant="additions"></div>
    </section>

    <div class="composer-wrap">
      <div class="attachments" id="attachments" aria-label="Attached files"></div>
      <form class="composer glass" id="composer" autocomplete="off">
        <label class="icon-btn attach" title="Attach PDF, text or code">
          <span class="i i-clip" aria-hidden="true"></span><span class="sr-only">Attach files</span>
          <input type="file" id="fileInput" multiple hidden>
        </label>
        <textarea id="input" rows="1" placeholder="Ask Rill anything…" aria-label="Message Rill" maxlength="20000"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send"><span class="i i-up" aria-hidden="true"></span></button>
      </form>
      <p class="composer-hint" id="hint">Enter to send · Shift+Enter for a new line · Drop files anywhere</p>
    </div>
  </main>

  <aside class="panel glass" id="panel" aria-label="Workspace" data-open="false">
    <div class="tabs" role="tablist">
      <button role="tab" class="tab" id="tab-plan" aria-selected="true" aria-controls="pane-plan" type="button">Plan</button>
      <button role="tab" class="tab" id="tab-files" aria-selected="false" aria-controls="pane-files" type="button">Files</button>
      <button role="tab" class="tab" id="tab-notes" aria-selected="false" aria-controls="pane-notes" type="button">Notes</button>
      <button class="icon-btn close-panel" id="closePanel" type="button" aria-label="Close panel"><span class="i i-x" aria-hidden="true"></span></button>
    </div>
    <div class="pane" id="pane-plan" role="tabpanel" aria-labelledby="tab-plan"></div>
    <div class="pane" id="pane-files" role="tabpanel" aria-labelledby="tab-files" hidden></div>
    <div class="pane" id="pane-notes" role="tabpanel" aria-labelledby="tab-notes" hidden></div>
  </aside>
</div>

<div class="dropzone" id="dropzone" hidden><div class="dropzone-card glass"><span class="i i-clip" aria-hidden="true"></span>Drop to add to Rill</div></div>

<dialog class="dialog glass" id="settings" aria-labelledby="settingsTitle">
  <form method="dialog" class="dialog-body" id="settingsForm">
    <h2 id="settingsTitle">Settings</h2>
    <label class="field"><span>What should Rill call you?</span><input name="name" maxlength="40" placeholder="Optional"></label>
    <label class="switch"><input type="checkbox" name="autoRun"><span class="track" aria-hidden="true"></span><span><b>Work through plans on my own</b><small>Rill starts plans automatically and keeps going until done.</small></span></label>
    <label class="switch"><input type="checkbox" name="thinking"><span class="track" aria-hidden="true"></span><span><b>Think before answering</b><small>Slower, sometimes better for tricky questions.</small></span></label>
    <label class="switch"><input type="checkbox" name="webReader"><span class="track" aria-hidden="true"></span><span><b>Web reader</b><small>Lets Rill read any web page via r.jina.ai. Page URLs are sent to that service.</small></span></label>
    <label class="field"><span>Compute</span>
      <select name="device"><option value="auto">Automatic (WebGPU when available)</option><option value="webgpu">WebGPU</option><option value="wasm">CPU (slow)</option></select>
    </label>
    <div class="dialog-actions">
      <button class="btn btn-danger" id="clearData" type="button">Erase all data</button>
      <span class="spacer"></span>
      <button class="btn btn-primary" value="save" type="submit">Done</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
